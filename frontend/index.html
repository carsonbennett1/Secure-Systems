<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Auth Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e8e8ed;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: #111118;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 1.75rem;
    }
    .tab {
      flex: 1;
      padding: .5rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #888;
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .tab.active {
      background: #2a2a3e;
      color: #e8e8ed;
    }

    /* Form */
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #fff;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 1.1rem;
    }
    label {
      font-size: .8125rem;
      color: #aaa;
      font-weight: 500;
    }
    input {
      padding: .6rem .75rem;
      background: #111118;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      color: #e8e8ed;
      font-size: .9375rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #5b5bd6; }
    input::placeholder { color: #444; }

    .field-error {
      font-size: .75rem;
      color: #e74c3c;
      min-height: 1rem;
    }

    /* Password strength */
    .strength-bar {
      height: 4px;
      background: #2a2a38;
      border-radius: 2px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0;
      border-radius: 2px;
      transition: width .3s, background .3s;
    }
    .strength-label {
      font-size: .75rem;
      color: #888;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: .7rem;
      background: #5b5bd6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: .9375rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s, opacity .15s;
    }
    .btn-primary:hover  { background: #6c6ce0; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      padding: .6rem;
      background: transparent;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      color: #aaa;
      font-size: .875rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: border-color .15s, color .15s;
    }
    .btn-secondary:hover { border-color: #5b5bd6; color: #e8e8ed; }

    .form-error {
      font-size: .8125rem;
      color: #e74c3c;
      min-height: 1rem;
      margin-bottom: .25rem;
    }

    /* Dashboard */
    .dashboard {
      text-align: center;
      max-width: 480px;
    }
    .avatar {
      width: 56px;
      height: 56px;
      background: #5b5bd6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 auto 1rem;
    }
    .user-email {
      color: #aaa;
      font-size: .9rem;
      margin-bottom: .25rem;
    }
    .user-id {
      color: #666;
      font-size: .78rem;
      margin-bottom: 1.5rem;
    }
    code {
      background: #111118;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: .75rem;
      color: #a0a0d0;
    }

    .security-notes {
      background: #111118;
      border: 1px solid #1e1e2e;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      text-align: left;
    }
    .security-notes h3 {
      font-size: .8125rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #5b5bd6;
      margin-bottom: .75rem;
    }
    .security-notes ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .security-notes li {
      font-size: .8125rem;
      color: #999;
      line-height: 1.5;
      padding-left: 1rem;
      position: relative;
    }
    .security-notes li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: #5b5bd6;
    }
    .security-notes strong { color: #c8c8f0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
